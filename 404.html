<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>
        404 | CANVAS
    </title>


    <link
        rel="preconnect"
        href="https://fonts.googleapis.com">


    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin>


    <link
        href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Inter:wght@400;500&display=swap"
        rel="stylesheet">


    <style>

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            min-height: 100vh;

            display: grid;

            place-items: center;

            padding: 24px;

            overflow: hidden;

            background: #08080d;

            color: #ffffff;

            font-family:
                Inter,
                Arial,
                sans-serif;

        }


        body::before {

            content: "";

            position: fixed;

            inset: 0;

            z-index: -2;

            background:

                linear-gradient(
                    rgba(5, 5, 10, 0.88),
                    rgba(8, 8, 13, 0.95)
                ),

                url(
                    "images/canvas-studio-background2.png"
                )
                center / cover
                no-repeat;

        }


        body::after {

            content: "";

            position: fixed;

            inset: 0;

            z-index: -1;

            background:

                radial-gradient(
                    circle at center,
                    rgba(155, 89, 255, 0.18),
                    transparent 36rem
                );

        }


        main {

            width:
                min(
                    760px,
                    100%
                );

            padding:
                48px;

            border:
                1px solid
                rgba(155, 89, 255, 0.4);

            border-radius:
                18px;

            background:
                rgba(8, 8, 14, 0.82);

            backdrop-filter:
                blur(12px);

            text-align:
                center;

        }


        small {

            color:
                #a875ff;

            font-family:
                Orbitron,
                sans-serif;

            letter-spacing:
                4px;

        }


        h1 {

            margin:
                18px 0 12px;

            font:

                700
                clamp(
                    54px,
                    11vw,
                    110px
                )
                / 0.95

                Orbitron,
                sans-serif;

        }


        p {

            color:
                #a09cab;

            line-height:
                1.7;

        }


        .actions {

            display:
                flex;

            justify-content:
                center;

            gap:
                10px;

            flex-wrap:
                wrap;

            margin-top:
                26px;

        }


        a {

            padding:
                11px 16px;

            border:
                1px solid
                rgba(255, 255, 255, 0.22);

            border-radius:
                8px;

            color:
                #ffffff;

            text-decoration:
                none;

            font:

                500
                9px

                Orbitron,
                sans-serif;

            letter-spacing:
                1px;

            text-transform:
                uppercase;

        }


        a.primary {

            background:
                #9b59ff;

            border-color:
                #9b59ff;

        }

    </style>

</head>


<body>

    <main>

        <small>
            CANVAS // 404
        </small>


        <h1>
            FRAME NOT FOUND.
        </h1>


        <p>

            The page you tried to open does not exist
            or the link has moved.

            Return to the CANVAS homepage or continue
            browsing the creative showcase.

        </p>


        <div class="actions">

            <a
                class="primary"
                href="index.html">

                Back Home

            </a>


            <a href="HTML/gallery.html">

                Open Gallery

            </a>


            <a href="HTML/project.html">

                View Projects

            </a>

        </div>

    </main>

</body>

</html>
